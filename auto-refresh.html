<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actualisation automatique</title>
  <style>
    :root { --bleu: #1F4E79; --texte: #333; --gris: #66717d; --vert: #2e7d32; --rouge: #b3261e; --ligne: #e3e8ee; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: .6rem .8rem; font: 14px system-ui, sans-serif; color: var(--texte); background: #fff; }
    .ligne { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
    .ligne + .ligne { margin-top: .5rem; }
    #point { width: 10px; height: 10px; border-radius: 50%; background: var(--vert); flex: none; }
    #point.pause { background: #b0b8c1; }
    #point.erreur { background: var(--rouge); }
    #point.encours { animation: pouls 1s ease-in-out infinite; }
    @keyframes pouls { 50% { opacity: .3; } }
    #etat { font-weight: 600; color: var(--bleu); }
    .gris { color: var(--gris); font-size: 13px; }
    label { color: var(--gris); font-size: 13px; }
    input { width: 4rem; padding: .25rem .4rem; border: 1px solid var(--ligne); border-radius: 6px; font: inherit; }
    button { padding: .3rem .8rem; border: 1px solid var(--bleu); background: #fff; color: var(--bleu); border-radius: 6px; font: inherit; cursor: pointer; }
    button:hover { background: #f1f6fb; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--bleu); outline-offset: 2px; }
    #message { color: var(--rouge); font-size: 13px; }
    @media (prefers-reduced-motion: reduce) { #point.encours { animation: none; } }
  </style>
</head>
<body>
  <div class="ligne">
    <span id="point"></span>
    <span id="etat">Démarrage…</span>
    <span class="gris" id="dernier"></span>
  </div>
  <div class="ligne">
    <label for="intervalle">Toutes les</label>
    <input type="number" id="intervalle" min="3" step="1" value="10">
    <label for="intervalle">secondes</label>
    <button id="bascule" type="button">Mettre en pause</button>
  </div>
  <div class="ligne"><span id="message" role="alert"></span></div>

  <script src="tableau.extensions.1.latest.min.js"></script>
  <script>
    (function () {
      const MIN = 3;                 // intervalle minimum autorisé (secondes)
      const $ = id => document.getElementById(id);
      let intervalle = 10, reste = 10;
      let actif = true, enCours = false, dernier = null, erreur = "";
      let dashboard = null;

      function afficher() {
        const point = $("point");
        point.className = enCours ? "encours" : (erreur ? "erreur" : (actif ? "" : "pause"));
        if (enCours) $("etat").textContent = "Actualisation…";
        else if (!actif) $("etat").textContent = "En pause";
        else $("etat").textContent = "Prochaine actualisation dans " + reste + " s";
        $("dernier").textContent = dernier ? "Dernière : " + dernier.toLocaleTimeString("fr-FR") : "";
        $("message").textContent = erreur;
        $("bascule").textContent = actif ? "Mettre en pause" : "Reprendre";
      }

      // Rafraîchit toutes les sources de données des feuilles du tableau de bord (une seule fois chacune)
      async function actualiser() {
        if (enCours) return;
        enCours = true; afficher();
        try {
          const sources = new Map();
          for (const feuille of dashboard.worksheets) {
            const liste = await feuille.getDataSourcesAsync();
            liste.forEach(s => sources.set(s.id, s));
          }
          await Promise.all([...sources.values()].map(s => s.refreshAsync()));
          dernier = new Date();
          erreur = "";
        } catch (e) {
          erreur = "Échec de l’actualisation : " + (e && e.message ? e.message : e);
        } finally {
          enCours = false;
          reste = intervalle;
          afficher();
        }
      }

      // Un tick par seconde ; la requête suivante ne part jamais pendant qu’une autre tourne
      function tick() {
        if (actif && !enCours) {
          reste--;
          if (reste <= 0) { actualiser(); return; }
        }
        afficher();
      }

      async function sauvegarder() {
        try {
          tableau.extensions.settings.set("intervalle", String(intervalle));
          await tableau.extensions.settings.saveAsync();
        } catch (e) { /* hors mode création : on garde la valeur en mémoire seulement */ }
      }

      function changerIntervalle() {
        const v = parseInt($("intervalle").value, 10);
        intervalle = Math.max(MIN, isNaN(v) ? 10 : v);
        $("intervalle").value = intervalle;
        reste = intervalle;
        sauvegarder();
        afficher();
      }

      $("intervalle").addEventListener("change", changerIntervalle);
      $("bascule").addEventListener("click", function () {
        actif = !actif;
        reste = intervalle;
        afficher();
      });

      if (typeof tableau === "undefined" || !tableau.extensions) {
        $("etat").textContent = "À ouvrir depuis Tableau";
        $("message").textContent = "Cette page doit être ajoutée comme extension dans un tableau de bord Tableau.";
        return;
      }

      tableau.extensions.initializeAsync().then(function () {
        dashboard = tableau.extensions.dashboardContent.dashboard;
        const memorise = parseInt(tableau.extensions.settings.get("intervalle"), 10);
        if (!isNaN(memorise)) intervalle = Math.max(MIN, memorise);
        $("intervalle").value = intervalle;
        reste = intervalle;
        afficher();
        setInterval(tick, 1000);
      }).catch(function (e) {
        $("etat").textContent = "Initialisation impossible";
        $("message").textContent = String(e && e.message ? e.message : e);
      });
    })();
  </script>
</body>
</html>
